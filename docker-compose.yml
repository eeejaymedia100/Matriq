# Matriq — Docker Compose (development / single-VM)
# Per infrastructure.md: single GCP VM, all services containerized.
# Only caddy binds to a public interface. Everything else is internal.

services:
  # ── Reverse proxy (the only service with an external port) ──
  caddy:
    image: caddy:2-alpine
    container_name: matriq-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Public waitlist landing page (static site served at matriq.com.ng)
      - ./waitlist:/srv/waitlist:ro
      # Cloudflare origin certs (gitignored) — used by Caddyfile.cloudflare
      - ./caddy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - matriq-net
    depends_on:
      - backend

  # ── NestJS Backend API ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matriq-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-matriq}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-matriq}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?err}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?err}
      - RESEND_API_KEY=${RESEND_API_KEY:?err}
      # Base URL used in verification emails (must be a public, reachable host).
      - APP_URL=${APP_URL:-https://api.matriq.com.ng}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_TIMEOUT_MS=${OLLAMA_TIMEOUT_MS:-180000}
      # AI capacity: cap concurrent Ollama calls (CPU-bound server). Excess
      # requests queue; after AI_QUEUE_TIMEOUT_MS they get a 503 "busy".
      - OLLAMA_MAX_CONCURRENCY=${OLLAMA_MAX_CONCURRENCY:-2}
      - OLLAMA_EMBED_MAX_CONCURRENCY=${OLLAMA_EMBED_MAX_CONCURRENCY:-2}
      - AI_QUEUE_TIMEOUT_MS=${AI_QUEUE_TIMEOUT_MS:-30000}
      # Process scaling: WORKERS=0 -> one process per CPU core (production
      # default); WORKERS=1 forces single-process (dev/debug); WORKERS=4 pins 4.
      - WORKERS=${WORKERS:-0}
      # Postgres pool per worker (workers × this = max DB connections).
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-5}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY:-}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      # Push notifications (self-hosted ntfy). Disabled unless NTFY_ENABLED=true.
      - NTFY_ENABLED=${NTFY_ENABLED:-false}
      - NTFY_URL=${NTFY_URL:-http://ntfy:80}
      # Object storage (MinIO/S3). Disabled unless S3_ENDPOINT is set.
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PORT=${S3_PORT:-9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-matriq}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      # Comma-separated allowed browser origins (Vercel dashboards; see docs/cloudflare-vercel.md)
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8081}
    expose:
      - "3000" # internal only — caddy routes via Docker network
    networks:
      - matriq-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── PostgreSQL + pgvector ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: matriq-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-matriq}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:-matriq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - matriq-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matriq} -d ${POSTGRES_DB:-matriq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (cache + BullMQ queue) ──
  redis:
    image: redis:7-alpine
    container_name: matriq-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - matriq-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── One-shot migration runner (explicit, reviewed step) ──
  # Not started by `up` (profile: tools). Run explicitly by scripts/deploy.sh
  # or CI: `docker compose run --rm migrate`. Reuses the built backend image
  # (prisma CLI is a runtime dependency) with the schema mounted in.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: matriq-migrate
    profiles: ["tools"]
    command: ["sh", "-c", "npx prisma migrate deploy"]
    working_dir: /app
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/prisma.config.ts:/app/prisma.config.ts
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-matriq}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-matriq}
    networks:
      - matriq-net
    depends_on:
      postgres:
        condition: service_healthy

  # ── Ollama model server (internal network only — never exposed publicly) ──
  ollama:
    image: ollama/ollama:latest
    container_name: matriq-ollama
    restart: unless-stopped
    # No ports published — reachable only within the Docker network
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - matriq-net
    # Start with no model pulled; pull on first use or via init script
    # CPU-only by default; add `deploy.resources.reservations.devices` for GPU

  # ── ntfy push notification server (self-hosted; https://ntfy.sh) ──
  # Publishes :8080 so mobile/web clients can subscribe. The backend always
  # talks to it over the internal network (http://ntfy:80).
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: matriq-ntfy
    restart: unless-stopped
    # The image ships the ntfy CLI; `serve` runs the HTTP server.
    command: serve
    ports:
      - "8080:80"
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8080}
      # NOTE: access tokens per-topic should be added once the public domain
      # is live (NTFY_AUTH_DEFAULT_ACCESS + per-topic tokens). The backend
      # keeps NTFY_ENABLED=false until an operator opts in, so this stays off
      # by default. Backend pushes come over the internal network.
    volumes:
      - ntfy_data:/var/lib/ntfy
    networks:
      - matriq-net

  # ── MinIO object storage (S3-compatible; private documents) ──
  # Only reachable on the internal network from the backend. The admin console
  # (127.0.0.1:9001) is for the operator only — never expose it publicly.
  minio:
    image: minio/minio:latest
    container_name: matriq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-matriq}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?err}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - matriq-net

networks:
  matriq-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  ntfy_data:
  minio_data:
  caddy_data:
  caddy_config:
