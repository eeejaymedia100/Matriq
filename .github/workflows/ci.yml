# Matriq — CI Pipeline (GitHub Actions)
# Per ci-cd.md: lint, type-check, tests, vulnerability scan, secret scan on every PR.
# This is the skeleton — it should pass green before Phase 0 is considered done.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend checks ──
  backend:
    name: Backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npx eslint 'src/**/*.ts' --ignore-pattern 'src/generated/**' --max-warnings 0

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ── Dependency vulnerability scan ──
  audit:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true # Report but don't block yet — tighten in Phase 6

  # ── Secret scanning (gitleaks) ──
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
