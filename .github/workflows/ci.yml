# Matriq — CI Pipeline (GitHub Actions)
# Per ci-cd.md: lint, type-check, tests, vulnerability scan, secret scan on every PR.
# Covers all four codebases + the backend container image (build only, not pushed).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Backend: lint + typecheck + tests + prisma + migrations ──
  backend:
    name: Backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    # Postgres with the pgvector extension — used by the migration drift check.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matriq
          POSTGRES_PASSWORD: matriq
          POSTGRES_DB: matriq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matriq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (glibc) — matches local dev and the production image.
          # argon2 0.45.1's musl prebuild segfaults on node:20-alpine, so the
          # whole stack pins to glibc builds.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npx eslint 'src/**/*.ts' --ignore-pattern 'src/generated/**' --max-warnings 0

      - name: Type-check
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://matriq:matriq@localhost:5432/matriq
        run: npx prisma validate

      # Drift gate: replay all committed migrations into a shadow schema and
      # compare against schema.prisma. Fails with --exit-code if the schema
      # changed without an accompanying migration. Works for any number of
      # migrations, unlike a from-empty baseline comparison.
      # Note: Prisma 7 removed --shadow-database-url; the shadow DB URL now
      # comes from datasource.shadowDatabaseUrl in prisma.config.ts.
      - name: Migration drift check
        env:
          DATABASE_URL: postgresql://matriq:matriq@localhost:5432/matriq
          SHADOW_DATABASE_URL: postgresql://matriq:matriq@localhost:5432/matriq
        run: |
          npx prisma migrate diff --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ── Backend container image (build only — catches Dockerfile breakage) ──
  backend-image:
    name: Backend Docker image build
    runs-on: ubuntu-latest

    # PrismaService connects to the database at boot, so the smoke test needs a
    # real Postgres (with the pgvector extension) to serve /health.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matriq
          POSTGRES_PASSWORD: matriq
          POSTGRES_DB: matriq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matriq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: matriq-backend:ci

      - name: Smoke-test image boots and serves /health
        run: |
          docker run -d --name matriq-ci -p 3000:3000 \
            -e NODE_ENV=test \
            -e DATABASE_URL=postgresql://matriq:matriq@localhost:5432/matriq \
            -e JWT_SECRET=ci-secret \
            -e JWT_REFRESH_SECRET=ci-secret \
            -e RESEND_API_KEY=re_dummy \
            matriq-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "health OK"; exit 0
            fi
            sleep 1
          done
          docker logs matriq-ci 2>&1 | tail -30
          exit 1

  # ── Mobile (Expo): typecheck + Android bundle ──
  mobile:
    name: Mobile (typecheck + bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Bundle Android (catches Metro/bundling errors)
        run: npx expo export --platform android --output-dir /tmp/expo-export

  # ── Association Dashboard (Next.js) ──
  dashboard:
    name: Dashboard (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  # ── Admin Console (Next.js) ──
  admin:
    name: Admin (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  # ── Dependency vulnerability scan (report-only until Phase 6) ──
  audit:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true # Report but don't block — tighten to a gate in Phase 6

  # ── Secret scanning (gitleaks) ──
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
