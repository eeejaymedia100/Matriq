<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #141416;
    --border: rgba(255, 255, 255, 0.12);
    --border-strong: rgba(198, 255, 61, 0.4);
    --text: #f5f4f1;
    --text-dim: #c8c6c1;
    --text-muted: #8e8c88;
    --lime: #c6ff3d;
    --ink: #17181a;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #161618 0%, var(--bg) 55%, #050505 100%);
    color: var(--text);
    line-height: 1.6;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
    background: rgba(20, 20, 22, 0.6);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 32px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
  }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 19px; text-decoration: none; color: var(--text);
    margin-bottom: 28px;
  }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--lime);
    color: var(--ink);
    display: grid; place-items: center; font-size: 18px;
  }
  .status {
    font-size: clamp(64px, 16vw, 96px);
    font-weight: 700;
    letter-spacing: -2px;
    color: var(--lime);
    line-height: 1;
  }
  h1 { font-size: clamp(22px, 4vw, 28px); margin: 14px 0 10px; letter-spacing: -0.5px; }
  p { color: var(--text-dim); font-size: 15px; max-width: 420px; margin: 0 auto 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 26px; }
  .btn {
    display: inline-block; padding: 13px 24px; border-radius: 999px;
    font-size: 15px; font-weight: 700; text-decoration: none;
    background: var(--lime);
    color: var(--ink);
    transition: transform 0.15s ease, filter 0.2s ease;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn-ghost {
    background: transparent; color: var(--text);
    border: 1px solid var(--border-strong);
  }
  .btn-ghost:hover { background: rgba(198, 255, 61, 0.1); color: var(--text); filter: none; }
  .links { margin-top: 26px; }
  .links a {
    color: var(--text-muted); font-size: 13px; text-decoration: none;
    margin: 0 8px; transition: color 0.2s ease;
  }
  .links a:hover { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .btn, .btn-ghost { transition: none; }
  }
</style>

<body>

    <a class="logo" href="/">

    <div class="actions">

      <a class="btn btn-ghost" href="https://t.me/+Bk-Wbby2_Cc3Njk0" target="_blank" rel="noopener">Join the Telegram</a>
    </div>
    <nav class="links" aria-label="More pages">
      <a href="/#why">Why Matriq</a>
      <a href="/#how">How it works</a>
      <a href="/terms.html">Terms</a>
      <a href="/privacy.html">Privacy</a>
    </nav>
  </main>
</body>
</html>
